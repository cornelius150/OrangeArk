<?xml version="1.0" encoding="UTF-8"?>
<!-- OrangeArk: format painter (格式刷) - a tilted paint brush with a yellow
     bristle head at the lower-left and a dark navy handle running to the
     upper-right, matching the user's reference artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- bristle head: a rounded wedge widening toward the lower-left tip -->
  <path d="M 8.65 7.35 L 10.35 9.05 L 7.05 13.15 C 6.15 14.25 4.55 14.45 3.45 13.55 C 2.35 12.65 2.05 11.05 2.85 9.95 Z"
        fill="#f5c542"/>
  <!-- shaded underside of the bristles -->
  <path d="M 2.85 9.95 L 7.05 13.15 C 6.15 14.25 4.55 14.45 3.45 13.55 C 2.35 12.65 2.05 11.05 2.85 9.95 Z"
        fill="#e0a92e"/>
  <!-- bristle streak lines -->
  <path d="M 4.30 11.30 L 7.60 9.60" stroke="#e0a92e" stroke-width="0.55" stroke-linecap="round" fill="none"/>
  <path d="M 5.05 12.25 L 8.35 10.55" stroke="#e0a92e" stroke-width="0.55" stroke-linecap="round" fill="none"/>
  <!-- metal ferrule between bristles and handle -->
  <path d="M 9.15 6.05 L 11.05 7.95 L 10.35 9.05 L 8.65 7.35 Z" fill="#9aa3ad"/>
  <path d="M 9.15 6.05 L 11.05 7.95 L 10.65 8.42 L 8.72 6.50 Z" fill="#6f7a86"/>
  <!-- dark navy handle to the upper-right -->
  <path d="M 10.60 6.60 L 13.45 3.75" stroke="#1f3864" stroke-width="2.9" stroke-linecap="round" fill="none"/>
  <path d="M 10.60 6.60 L 13.45 3.75" stroke="#2d4f8f" stroke-width="1.25" stroke-linecap="round" fill="none"/>
</svg>
