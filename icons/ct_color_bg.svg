<?xml version="1.0" encoding="UTF-8"?>
<!-- OrangeArk: highlighter icon per user's reference image —
     tall yellow spiral notebook (navy outline, thin cover band, page box + lines)
     with a long diagonal pencil overlapping the bottom-right corner. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- notebook page -->
  <rect x="1.8" y="1.6" width="8.4" height="13.0" rx="2.0" fill="#F5D05E" stroke="#2E4053" stroke-width="1.3"/>
  <!-- thin cover band on top -->
  <path d="M1.8 2.9 L1.8 3.6 Q1.8 1.6 3.8 1.6 L8.2 1.6 Q10.2 1.6 10.2 3.6 L10.2 2.9 Z" fill="#2E4053"/>
  <rect x="2.45" y="2.9" width="7.1" height="0.45" fill="#FFFFFF"/>
  <!-- spiral rings on the left edge -->
  <g fill="#FFFFFF" stroke="#2E4053" stroke-width="1.0">
    <rect x="0.5" y="4.0" width="2.4" height="1.8" rx="0.9"/>
    <rect x="0.5" y="7.2" width="2.4" height="1.8" rx="0.9"/>
    <rect x="0.5" y="10.4" width="2.4" height="1.8" rx="0.9"/>
  </g>
  <!-- page content: picture box + two text lines -->
  <rect x="4.4" y="4.5" width="4.3" height="2.7" fill="#FFFFFF" stroke="#2E4053" stroke-width="0.9"/>
  <rect x="4.4" y="7.9" width="3.4" height="0.75" rx="0.37" fill="#2E4053"/>
  <rect x="4.4" y="8.95" width="2.4" height="0.75" rx="0.37" fill="#2E4053"/>
  <!-- pencil: wood cone (white) -->
  <path d="M12.14 11.27 L9.82 10.10 L9.18 14.25 Z" fill="#FFFFFF" stroke="#2E4053" stroke-width="1.0" stroke-linejoin="round"/>
  <!-- graphite tip -->
  <path d="M9.18 14.25 L10.12 13.50 L9.23 13.05 Z" fill="#2E4053"/>
  <!-- pencil body (yellow) -->
  <path d="M15.06 5.49 L12.74 4.32 L9.82 10.10 L12.14 11.27 Z" fill="#F5D05E" stroke="#2E4053" stroke-width="1.0" stroke-linejoin="round"/>
  <!-- end cap -->
  <path d="M15.47 4.68 L13.15 3.52 L12.74 4.32 L15.06 5.49 Z" fill="#2E4053"/>
</svg>
