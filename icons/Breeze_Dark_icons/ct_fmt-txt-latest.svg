<?xml version="1.0" encoding="UTF-8"?>
<!-- OrangeArk: repeat last format - the same small brush (smaller, shifted
     down-right) plus an orange repeat arrow at the top-left -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- repeat arrow -->
  <path d="M 2.2 5.2 A 3.4 3.4 0 0 1 7.6 2.9" fill="none" stroke="#fb8c00" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 8.6 1.1 L 8.7 4.2 L 5.8 3.3 Z" fill="#fb8c00"/>
  <!-- brush -->
  <g transform="translate(2.6 2.6) scale(0.78)">
    <path d="M 8.6 7.9 L 10.1 9.4 L 6.8 13.7 C 6.0 14.6 4.7 14.8 3.7 14.1 C 2.7 13.4 2.4 12.2 2.9 11.2 Z" fill="#e8c07c"/>
    <path d="M 2.9 11.2 L 6.8 13.7 C 6.0 14.6 4.7 14.8 3.7 14.1 C 2.7 13.4 2.4 12.2 2.9 11.2 Z" fill="#d9a95e"/>
    <path d="M 9.4 6.3 L 10.7 7.6 L 10.1 9.4 L 8.6 7.9 Z" fill="#5f5f5f"/>
    <path d="M 10.0 6.9 L 13.9 3.0" stroke="#4a4a4a" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
